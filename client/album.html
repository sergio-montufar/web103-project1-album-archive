<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Album · Album Archive</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>
  <body>
    <main class="container">
      <header class="archive-header">
        <h1><a href="/">🎵 Album Archive</a></h1>
      </header>
      <p><a href="/">&larr; Back to all albums</a></p>
      <section id="album-detail" class="detail-layout" aria-busy="true">
        <div>
          <img id="cover" alt="" />
        </div>
        <div>
          <hgroup>
            <h2 id="title"></h2>
            <p id="artist"></p>
          </hgroup>
          <p>
            <span id="genre" class="tag"></span>
            <span id="year" class="tag"></span>
          </p>
          <h4>Track List</h4>
          <ol id="track-list" class="track-list"></ol>
        </div>
      </section>
    </main>
    <footer class="container" style="text-align: center; padding: 2rem 0">
      <small>Album Archive · Built with Express &amp; Picocss</small>
    </footer>
    <script type="module" src="/src/album.js"></script>
  </body>
</html>
