<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Album Archive</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>
  <body>
    <main class="container">
      <header class="archive-header">
        <h1><a href="/">🎵 Album Archive</a></h1>
        <p>A small collection of albums worth listening to all the way through.</p>
        <input
          type="search"
          id="album-search"
          class="album-search"
          placeholder="Search by title, artist, or genre…"
          aria-label="Search albums"
        />
      </header>
      <section id="album-grid" class="album-grid" aria-busy="true">
        Loading albums…
      </section>
    </main>
    <footer class="container" style="text-align: center; padding: 2rem 0">
      <small>Album Archive · Built with Express &amp; Picocss</small>
    </footer>
    <script type="module" src="/src/list.js"></script>
  </body>
</html>
